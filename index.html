<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>表达力探索 · Expression Explorer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◈</text></svg>">
<style>
:root{
  --paper:#f6f4ef; --ink:#1a1f2e; --soft:#3a4252; --muted:#7a8290;
  --line:#dcd8ce; --card:#fffdf8;
  --navy:#1e3a5f; --terra:#b85c2a; --forest:#3a6b5c; --accent:#1e3a5f;
  --danger:#c0504a; --success:#4a9e6a; --warn:#c99a3f;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,"Courier New",monospace;
  --sans:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
}
body.dark{
  --paper:#14171f; --ink:#e8eaf0; --soft:#c4c9d4; --muted:#8891a0;
  --line:#2a3040; --card:#1c212c;
  --navy:#6f9bd8; --terra:#d98a5c; --forest:#6fa58f;
  --danger:#e07870; --success:#6bc48e; --warn:#dcb46a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;
  line-height:1.7;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.hidden{display:none!important}
.svgic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}

/* 顶栏 */
.topbar{height:58px;display:flex;align-items:center;gap:16px;padding:0 20px;
  border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:20}
.brand{font-weight:700;font-size:16px}
.brand small{font-family:var(--mono);font-size:9.5px;color:var(--muted);font-weight:400;
  letter-spacing:.14em;display:block;text-transform:uppercase}
.modepick{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.modepick button{padding:7px 18px;font-size:13.5px;color:var(--soft);display:flex;gap:7px;align-items:center}
.modepick button.sel{background:var(--accent);color:#fff}
.topbar .spacer{flex:1}
.miniprogress{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.minibar{width:110px;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.minibar i{display:block;height:100%;background:var(--accent);transition:width .4s}
.iconbtn{width:36px;height:36px;border:1px solid var(--line);border-radius:8px;display:inline-flex;
  align-items:center;justify-content:center;color:var(--soft)}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}

/* A 学习布局 */
#modeA{display:grid;grid-template-columns:250px 1fr;height:calc(100vh - 58px)}
.sidebar{border-right:1px solid var(--line);overflow-y:auto;padding:14px 12px}
.search{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);
  color:var(--ink);font-family:inherit;font-size:13px;margin-bottom:14px}
.search:focus{outline:none;border-color:var(--accent)}
.group{margin-bottom:15px}
.group>b{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--muted);
  display:flex;justify-content:space-between;padding:0 6px;margin-bottom:6px;text-transform:uppercase}
.lesson{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px;border-radius:8px;font-size:13.5px}
.lesson:hover{background:var(--card)}
.lesson.active{background:var(--card);box-shadow:inset 2px 0 0 var(--accent)}
.ldot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.lesson.active .ldot{background:var(--accent)}
.lesson .lt{flex:1}
.lesson small{font-family:var(--mono);font-size:9px;color:var(--muted);display:block;letter-spacing:.08em}
.main{overflow-y:auto;padding:22px 26px;display:flex;flex-direction:column;gap:18px}
.head{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px}
.head h1{font-size:26px}
.head .en{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{padding:7px 16px;font-size:13px;color:var(--soft)}
.seg button.sel{background:var(--accent);color:#fff}
.stage{position:relative;border:1px solid var(--line);border-radius:12px;background:var(--card);
  padding:24px 20px 18px;min-height:228px}
.stage .cap{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.12em;
  text-transform:uppercase;margin-bottom:16px}
.nodes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;position:relative;z-index:2}
.node{border:1px solid var(--line);border-radius:10px;padding:12px 8px;text-align:center;background:var(--paper)}
.node b{display:block;font-size:14px}
.node small{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.06em}
.stage svg.lines{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.traveldot{fill:var(--accent);filter:drop-shadow(0 0 5px var(--accent))}
.ctrl{display:flex;align-items:center;gap:10px}
.ctrl .info{flex:1}
.ctrl .stepname{font-weight:600}
.ctrl .stepdesc{color:var(--muted);font-size:13px}
.pill{font-family:var(--mono);font-size:11px;padding:5px 10px;border:1px solid var(--line);border-radius:7px;color:var(--soft)}
.trace{width:100%;border-collapse:collapse;font-size:13px}
.trace th{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted);text-align:left;
  padding:8px 10px;border-bottom:1px solid var(--line);text-transform:uppercase}
.trace td{padding:9px 10px;border-bottom:1px solid var(--line);color:var(--soft)}
.trace tr.cur td{background:var(--card);color:var(--ink)}
.trace tr.cur td:first-child{box-shadow:inset 2px 0 0 var(--accent)}
.trace .no{font-family:var(--mono);color:var(--muted)}
.gotrain{margin-top:4px}
.gotrain button{display:inline-flex;gap:8px;align-items:center;color:var(--accent);font-size:13.5px;font-weight:600}
.casebox{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:22px}
.casebox .ctx{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.1em;
  text-transform:uppercase;margin-bottom:16px}
.casegrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.persona{border-radius:10px;padding:16px;border:1px solid var(--line)}
.persona.junior{border-left:4px solid var(--danger)}
.persona.senior{border-left:4px solid var(--success)}
.persona .who{font-weight:700;font-size:14px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.persona .who small{font-family:var(--mono);font-size:10px;color:var(--muted);font-weight:400}
.persona .say{font-size:14px;line-height:1.75;margin-bottom:10px}
.persona .pnote{font-size:12.5px;color:var(--muted)}
.casediff{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);font-size:13.5px;color:var(--soft)}
.casediff b{color:var(--accent)}

/* B 训练布局 */
#modeB{height:calc(100vh - 58px);overflow-y:auto}
.bwrap{max-width:920px;margin:0 auto;padding:28px 26px 60px}
.bh{margin-bottom:20px}
.bh h2{font-size:24px}
.bh p{color:var(--muted);font-size:14px;margin-top:4px}
.entrypick{display:flex;gap:8px;margin-bottom:16px}
.entrypick button{padding:8px 18px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;color:var(--soft)}
.entrypick button.sel{border-color:var(--accent);color:var(--accent)}
.catpick{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap}
.catpick button{padding:6px 13px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;color:var(--soft)}
.catpick button.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.qpick{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);
  color:var(--ink);font-family:inherit;font-size:14px;margin-bottom:14px}
.rawbox{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:10px;
  padding:16px 18px;font-size:13.5px;color:var(--soft);margin-bottom:14px;white-space:pre-wrap}
.rawbox .rt{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.1em;
  text-transform:uppercase;display:block;margin-bottom:8px}
textarea{width:100%;min-height:210px;background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:16px;font-family:var(--sans);font-size:15px;line-height:1.8;color:var(--ink);resize:vertical}
textarea:focus{outline:none;border-color:var(--accent)}
.btnrow{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap}
.btnprimary{background:var(--accent);color:#fff;padding:12px 30px;border-radius:10px;font-size:15px;font-weight:600}
.btnprimary:hover{opacity:.9}
.btnghost{padding:12px 24px;border:1px solid var(--line);border-radius:10px;font-size:15px;color:var(--soft)}
/* 结果 */
.result{margin-top:26px;display:flex;flex-direction:column;gap:20px}
.scorecard{display:flex;gap:34px;align-items:center;flex-wrap:wrap;background:var(--card);
  border:1px solid var(--line);border-radius:14px;padding:26px}
.ring{position:relative;width:130px;height:130px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-family:var(--mono);font-size:34px}
.ring .num small{font-size:11px;color:var(--muted)}
.dimbars{flex:1;min-width:240px;display:flex;flex-direction:column;gap:12px}
.dimbar{display:flex;align-items:center;gap:12px}
.dimbar .dl{width:96px;font-size:13px;color:var(--soft);flex:none}
.dimbar .dc{flex:1;height:9px;background:var(--line);border-radius:5px;overflow:hidden}
.dimbar .df{height:100%;border-radius:5px}
.dimbar .ds{width:40px;text-align:right;font-family:var(--mono);font-size:12px}
.fblist{display:flex;flex-direction:column;gap:12px}
.fb{border-radius:10px;padding:16px 18px;display:flex;gap:14px;align-items:flex-start}
.fb.pass{background:color-mix(in srgb,var(--success) 12%,transparent);border-left:4px solid var(--success)}
.fb.fail{background:color-mix(in srgb,var(--danger) 12%,transparent);border-left:4px solid var(--danger)}
.fb .fi{width:26px;height:26px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:13px;font-weight:700}
.fb.pass .fi{background:var(--success)} .fb.fail .fi{background:var(--danger)}
.fb .ftitle{font-weight:600;font-size:14.5px;margin-bottom:2px}
.fb .ftext{font-size:13.5px;color:var(--soft)}
.fb .fsug{font-size:13px;color:var(--accent);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.compare{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.compare h3,.perfect h3{font-size:16px;margin-bottom:14px}
.cmpitem{border-radius:10px;padding:14px 16px;margin-bottom:10px;font-size:13.5px}
.cmpitem.good{border-left:4px solid var(--success);background:color-mix(in srgb,var(--success) 9%,transparent)}
.cmpitem.bad{border-left:4px solid var(--danger);background:color-mix(in srgb,var(--danger) 9%,transparent)}
.cmpitem .tag{display:inline-block;padding:2px 8px;border-radius:5px;color:#fff;font-size:11px;margin-bottom:6px}
.cmpitem.good .tag{background:var(--success)} .cmpitem.bad .tag{background:var(--danger)}
.perfect{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.pyr{display:flex;flex-direction:column;align-items:center;gap:14px}
.pyr .pconc{background:var(--accent);color:#fff;border-radius:12px;padding:16px 24px;width:100%;text-align:center}
.pyr .ppoints{width:100%;display:flex;flex-direction:column;gap:10px}
.ppoint{border:1px solid var(--accent);border-radius:10px;padding:12px 16px}
.ppoint b{font-size:14px} .ppoint span{display:block;font-size:13px;color:var(--muted);margin-top:3px}
@media(max-width:780px){
  #modeA{grid-template-columns:1fr}
  .sidebar{display:none}
  .nodes{grid-template-columns:repeat(2,1fr)}
  .casegrid{grid-template-columns:1fr}
  .modepick button{padding:7px 12px}
  .minibar{display:none}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">表达力探索<small>Expression Explorer</small></div>
  <div class="modepick">
    <button id="m-A" class="sel">学习</button>
    <button id="m-B">训练</button>
  </div>
  <div class="spacer"></div>
  <div class="miniprogress">
    <span id="mp-text">1 / 10</span>
    <div class="minibar"><i id="mp-fill"></i></div>
  </div>
  <button class="iconbtn" id="themebtn">
    <svg class="svgic" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
  </button>
</header>

<!-- ===== 模式 A：学习 ===== -->
<section id="modeA">
  <aside class="sidebar">
    <input class="search" id="navsearch" placeholder="搜索课程 / 关键词…">
    <div id="nav"></div>
  </aside>
  <div class="main">
    <div class="head">
      <div>
        <h1 id="title"></h1>
        <div class="en" id="en"></div>
      </div>
      <div class="seg">
        <button id="sc-plain">普通说法</button>
        <button id="sc-better">更好说法</button>
      </div>
    </div>
    <div class="stage">
      <div class="cap" id="scenecap"></div>
      <svg class="lines" id="lines" preserveAspectRatio="none" viewBox="0 0 100 100"></svg>
      <div class="nodes" id="nodes"></div>
    </div>
    <div class="ctrl">
      <button class="iconbtn" id="playbtn">
        <svg class="svgic" viewBox="0 0 24 24" id="playic"><path d="M7 5v14l11-7z"/></svg>
      </button>
      <button class="iconbtn" id="resetbtn">
        <svg class="svgic" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/></svg>
      </button>
      <span class="pill" id="speedtxt">1×</span>
      <div class="info">
        <div class="stepname" id="stepname"></div>
        <div class="stepdesc" id="stepdesc"></div>
      </div>
    </div>
    <table class="trace">
      <thead><tr><th style="width:46px">#</th><th style="width:36%">本步</th><th>状态观察</th></tr></thead>
      <tbody id="tracebody"></tbody>
    </table>
    <div class="casebox" id="casebox"></div>
    <div class="gotrain"><button id="gotrain">去练这一课 →</button></div>
  </div>
</section>

<!-- ===== 模式 B：训练 ===== -->
<section id="modeB" class="hidden">
  <div class="bwrap">
    <div class="bh">
      <h2>训练工坊</h2>
      <p>把你想说的话写下来，系统按四个维度打分，并给出可执行的改写建议。</p>
    </div>
    <div class="entrypick">
      <button id="en-bank" class="sel">题库练习</button>
      <button id="en-free">我的表达</button>
    </div>
    <div id="bankpart">
      <div class="catpick" id="catpick"></div>
      <select class="qpick" id="qselect"></select>
      <div class="rawbox" id="rawbox"></div>
    </div>
    <textarea id="usertext" placeholder="在这里写下你的表达…（题库模式下请把上面的原始信息重组成金字塔结构）"></textarea>
    <div class="btnrow">
      <button class="btnprimary" id="analyzebtn">提交评分</button>
      <button class="btnghost" id="clearbtn">清空重写</button>
    </div>
    <div class="result" id="result"></div>
  </div>
</section>

<script>
/* ================= 数据：10 课 ================= */
const GROUPS=[
  {id:'g0',name:'结构',color:'#1e3a5f'},
  {id:'g1',name:'增量与语气',color:'#b85c2a'},
  {id:'g2',name:'场景',color:'#3a6b5c'}
];
const LESSONS=[
 {id:'conclusion-first',group:'g0',title:'结论先行',en:'Conclusion First',
  better:{cap:'更好说法 · 30 秒内先给答案',steps:[
   {name:'开口先给结论',obs:'第一句就把判断/建议抛出，对方立刻知道你要他做什么'},
   {name:'再给三个支撑点',obs:'每个点一句话，彼此独立、不重叠'},
   {name:'用数据补强',obs:'关键论点配一个数字或事实，可信度立刻上来'},
   {name:'收尾确认行动',obs:'明确下一步谁做什么，闭环'}]},
  plain:{cap:'普通说法 · 铺垫半天才到重点',steps:[
   {name:'先讲背景',obs:'从“是这样的”开始，对方还不知道你要干嘛'},
   {name:'再讲过程细节',obs:'按时间顺序堆流水账，重点淹没在细节里'},
   {name:'中途插新情况',obs:'想到哪说到哪，逻辑线被打断'},
   {name:'最后才说结论',obs:'听到这里对方可能已经走神，重点没接住'}]}},
 {id:'pyramid-mece',group:'g0',title:'金字塔与 MECE',en:'Pyramid & MECE',
  better:{cap:'更好说法 · 先塔尖后塔基',steps:[
   {name:'塔尖放中心思想',obs:'一句话概括全部，下面都是它的支撑'},
   {name:'分 2-4 组论点',obs:'同层之间相互独立、完全穷尽（MECE）'},
   {name:'每组下挂证据',obs:'论点在上、事实在下，层次分明'},
   {name:'检查有无重叠',obs:'确认没有一个点被讲两遍'}]},
  plain:{cap:'普通说法 · 论点交叉',steps:[
   {name:'直接罗列要点',obs:'没有中心思想统摄，要点像散落的珠子'},
   {name:'论点互相包含',obs:'A 点和 B 点讲了同一件事，显得啰嗦'},
   {name:'维度混在一起',obs:'有的讲原因、有的讲对策，层级混乱'},
   {name:'漏掉关键方面',obs:'没有 MECE 检查，重要类别被遗漏'}]}},
 {id:'scqa-prep',group:'g0',title:'SCQA 与 PREP',en:'SCQA & PREP',
  better:{cap:'更好说法 · 有开场有结构',steps:[
   {name:'S 情境引入',obs:'用对方熟悉的背景建立共鸣'},
   {name:'C 冲突制造张力',obs:'点出矛盾，让人想知道答案'},
   {name:'Q 抛出问题',obs:'自然引出你要回答的核心问题'},
   {name:'A 给出答案',obs:'再用 PREP（观点-理由-例子-观点）展开'}]},
  plain:{cap:'普通说法 · 平铺开场',steps:[
   {name:'直接讲方案',obs:'对方还没进入情境，get 不到为什么重要'},
   {name:'没有冲突',obs:'平铺直叙，缺少让人听下去的张力'},
   {name:'结构松散',obs:'观点和例子穿插，抓不住主线'},
   {name:'结尾不回扣',obs:'讲完没有重申观点，记忆点弱'}]}},
 {id:'increment',group:'g1',title:'信息增量',en:'Information Increment',
  better:{cap:'更好说法 · 每句都有新信息',steps:[
   {name:'先问对方知道吗',obs:'已知的信息一句带过，不重复'},
   {name:'只讲增量部分',obs:'聚焦对方不知道的新事实、新判断'},
   {name:'删掉正确废话',obs:'“要重视”“要加强”这类无信息量的话删掉'},
   {name:'给出明确指向',obs:'每条都落到具体动作或结论'}]},
  plain:{cap:'普通说法 · 正确废话连篇',steps:[
   {name:'复述对方已知',obs:'大段背景对方早就清楚，浪费时间'},
   {name:'讲空泛原则',obs:'“要高度重视”却不说怎么重视'},
   {name:'同义反复',obs:'换个说法重复同一件事，没有新增'},
   {name:'听完不知道做啥',obs:'信息密度太低，没有可执行点'}]}},
 {id:'specific',group:'g1',title:'具体化',en:'Be Specific',
  better:{cap:'更好说法 · 下梯子到事实',steps:[
   {name:'下抽象梯子',obs:'把“效果不好”换成具体哪里不好'},
   {name:'加数字',obs:'“很快”→“3 天内”，“很多”→“12 个”'},
   {name:'给可感知细节',obs:'用一个具体场景让人“看见”'},

/* ================= 状态与本地存储 ================= */
const store={
  get(k,d){try{return JSON.parse(localStorage.getItem('expr_'+k))??d}catch(e){return d}},
  set(k,v){try{localStorage.setItem('expr_'+k,JSON.stringify(v))}catch(e){}}
};
let state={mode:store.get('mode','A'),lesson:store.get('lesson','conclusion-first'),
  scene:store.get('scene','plain'),step:0,playing:false,timer:null,speed:1,
  entry:store.get('entry','bank'),bankcat:store.get('bankcat','业务汇报')};

/* ================= A 学习模式 ================= */
function curLesson(){return LESSONS.find(l=>l.id===state.lesson)||LESSONS[0]}
function renderNav(){
  const q=(document.getElementById('navsearch').value||'').toLowerCase();
  document.getElementById('nav').innerHTML=GROUPS.map(g=>{
    const ls=LESSONS.filter(l=>l.group===g.id&&(!q||l.title.toLowerCase().includes(q)||l.en.toLowerCase().includes(q)));
    if(!ls.length)return '';
    return `<div class="group"><b><span>${g.name}</span><span>${ls.length}</span></b>`+
      ls.map(l=>`<button class="lesson ${l.id===state.lesson?'active':''}" data-id="${l.id}">
        <span class="ldot" style="background:${g.color}"></span>
        <span class="lt">${l.title}<small>${l.en}</small></span></button>`).join('')+'</div>';
  }).join('');
  document.querySelectorAll('.lesson').forEach(b=>b.onclick=()=>{state.lesson=b.dataset.id;
    store.set('lesson',state.lesson);state.step=0;stopPlay();renderA()});
}
function renderA(){
  const l=curLesson(),sc=l[state.scene];
  document.getElementById('title').textContent=l.title;
  document.getElementById('en').textContent=l.en;
  document.getElementById('scenecap').textContent=sc.cap;
  document.getElementById('sc-better').classList.toggle('sel',state.scene==='better');
  document.getElementById('sc-plain').classList.toggle('sel',state.scene==='plain');
  document.getElementById('nodes').innerHTML=sc.steps.map((s,i)=>
    `<div class="node"><small>0${i+1}</small><b>${s.name}</b></div>`).join('');
  document.getElementById('tracebody').innerHTML=sc.steps.map((s,i)=>
    `<tr class="${i===state.step?'cur':''}" data-i="${i}"><td class="no">0${i+1}</td><td>${s.name}</td><td>${s.obs}</td></tr>`).join('');
  document.querySelectorAll('#tracebody tr').forEach(r=>r.onclick=()=>{state.step=+r.dataset.i;stopPlay();updateStep()});
  document.getElementById('speedtxt').textContent=state.speed+'×';
  renderCases();
  updateStep();updateMini();
}
function renderCases(){
  const c=CASES[curLesson().id];
  if(!c){document.getElementById('casebox').innerHTML='';return}
  document.getElementById('casebox').innerHTML=`
    <div class="ctx">案例对比 · ${esc(c.context)}</div>
    <div class="casegrid">
      <div class="persona junior"><div class="who">${esc(c.junior.who)}<small>JUNIOR</small></div>
        <div class="say">“${esc(c.junior.say)}”</div><div class="pnote">${esc(c.junior.note)}</div></div>
      <div class="persona senior"><div class="who">${esc(c.senior.who)}<small>SENIOR</small></div>
        <div class="say">“${esc(c.senior.say)}”</div><div class="pnote">${esc(c.senior.note)}</div></div>
    </div>
    <div class="casediff"><b>差在哪：</b>${esc(c.diff)}</div>`;
}
function updateStep(){
  const sc=curLesson()[state.scene],s=sc.steps[state.step];
  document.getElementById('stepname').textContent=`0${state.step+1} · ${s.name}`;
  document.getElementById('stepdesc').textContent=s.obs;
  document.querySelectorAll('#tracebody tr').forEach((r,i)=>r.classList.toggle('cur',i===state.step));
  drawDot();
}
function drawDot(){
  const n=curLesson()[state.scene].steps.length;
  const x=12.5+(state.step)*(75/(n-1)), y=30;
  let svg=document.getElementById('lines');
  svg.innerHTML='<circle class="traveldot" r="2.6" cx="'+x+'" cy="'+y+'"></circle>';
}
function playStep(){
  const n=curLesson()[state.scene].steps.length;
  if(state.step>=n-1){stopPlay();return}
  state.step++;updateStep();
}
function startPlay(){
  const n=curLesson()[state.scene].steps.length;
  if(state.step>=n-1)state.step=0;
  state.playing=true;
  document.getElementById('playic').innerHTML='<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
  state.timer=setInterval(playStep,1400/state.speed);
}
function stopPlay(){state.playing=false;clearInterval(state.timer);
  document.getElementById('playic').innerHTML='<path d="M7 5v14l11-7z"/>';}
function updateMini(){
  const done=store.get('done',[]);
  document.getElementById('mp-text').textContent=done.length+' / 10';
  document.getElementById('mp-fill').style.width=(done.length*10)+'%';
}
function markDone(){const d=new Set(store.get('done',[]));d.add(state.lesson);
  store.set('done',[...d]);updateMini();}

/* 场景切换 */
document.getElementById('sc-better').onclick=()=>{state.scene='better';store.set('scene','better');state.step=0;stopPlay();renderA()};
document.getElementById('sc-plain').onclick=()=>{state.scene='plain';store.set('scene','plain');state.step=0;stopPlay();renderA()};
document.getElementById('playbtn').onclick=()=>state.playing?stopPlay():startPlay();
document.getElementById('resetbtn').onclick=()=>{stopPlay();state.step=0;updateStep()};
document.getElementById('speedtxt').onclick=()=>{state.speed=state.speed>=2?0.5:state.speed+0.5;
  document.getElementById('speedtxt').textContent=state.speed+'×';if(state.playing){stopPlay();startPlay()}};
document.getElementById('navsearch').oninput=renderNav;
document.getElementById('gotrain').onclick=()=>{markDone();switchMode('B')};

/* ================= 模式切换 ================= */
function switchMode(m){
  state.mode=m;store.set('mode',m);
  document.getElementById('modeA').classList.toggle('hidden',m==='B');
  document.getElementById('modeB').classList.toggle('hidden',m==='A');
  document.getElementById('m-A').classList.toggle('sel',m==='A');
  document.getElementById('m-B').classList.toggle('sel',m==='B');
}
document.getElementById('m-A').onclick=()=>switchMode('A');
document.getElementById('m-B').onclick=()=>switchMode('B');

/* 主题 */
if(store.get('dark',false))document.body.classList.add('dark');
document.getElementById('themebtn').onclick=()=>{
  document.body.classList.toggle('dark');store.set('dark',document.body.classList.contains('dark'));
};

/* ================= 分析引擎 ================= */
function firstSentence(t){const s=t.split(/[。！？\n]/).filter(x=>x.trim())[0]||'';return s.trim()}
function extractPoints(t){
  const parts=t.split(/(?:第一|第二|第三|首先|其次|然后|最后|\d[.、])/).map(s=>s.trim()).filter(s=>s.length>8);
  return parts.length>=2?parts:t.split(/[。！？]/).filter(s=>s.trim().length>10);
}
function keywords(s){
  const words=s.match(/[一-龥]{2,4}/g)||[];
  return [...new Set(words)].filter(w=>!['我们','一个','可以','因为','所以','领导','目前'].includes(w));
}
function analyze(text){
  const r={score:0,dims:{},problems:[]};
  // 1 结论先行
  const fs=firstSentence(text);
  const cWords=['因此','建议','结论','需要','必须','提议','核心','总结','我认为','申请'];
  const bWords=['因为','虽然','首先','之前','背景','根据','领导好','是这样','情况是'];
  let cFirst=cWords.some(w=>fs.includes(w))&&!bWords.some(w=>fs.includes(w));
  let cScore=cFirst?85:40; if(fs.length>80)cScore-=15;
  r.dims['结论先行']={score:cScore,pass:cScore>=60};
  if(!cFirst)r.problems.push({dim:'结论先行',text:'开头更像背景铺垫，没有直接给结论',
    sug:'用「因此」「建议」「核心是」等词开头，直接抛出结论'});
  // 2 论点独立性
  const pts=extractPoints(text),kws=pts.map(keywords);
  let overlap=0,pairs=0;
  for(let i=0;i<kws.length;i++)for(let j=i+1;j<kws.length;j++){pairs++;
    const inter=kws[i].filter(k=>kws[j].includes(k));
    const uni=new Set([...kws[i],...kws[j]]);
    if(inter.size/uni.size>0.3)overlap++;}
  let mScore=pts.length>=2?Math.max(30,100-(overlap/Math.max(pairs,1))*50):55;
  r.dims['论点独立性']={score:mScore,pass:mScore>=55};
  if(mScore<55)r.problems.push({dim:'论点独立性',text:'论点之间存在内容交叉',
    sug:'确认各点讲不同方面，合并重复内容'});
  // 3 论据充分
  const ev=[/[0-9]+%/,/[0-9]+(?:人|次|台|个|起|例|万|元|块)/,/数据|根据|相比|增长|下降/,/共计|平均|累计|完成|占比/];
  let ec=ev.filter(p=>p.test(text)).length;
  let eScore=Math.min(100,40+ec*20);
  r.dims['论据充分性']={score:eScore,pass:eScore>=60};
  if(eScore<60)r.problems.push({dim:'论据充分性',text:'缺少具体数据或事实支撑',
    sug:'加数字（百分比、金额、人数）、对比或案例来支撑论点'});
  // 4 逻辑顺序
  const num=/第一.*第二|1.*2.*3|一.*二|首先.*然后/.test(text);
  let oScore=num?80:(pts.length>1?55:70);
  r.dims['逻辑顺序']={score:oScore,pass:oScore>=60};
  if(oScore<60)r.problems.push({dim:'逻辑顺序',text:'论点排列缺乏明显顺序',
    sug:'用编号（第一、第二）或顺序词（首先、然后、最后）组织'});
  // 加权
  const w={'结论先行':.3,'论据充分性':.3,'论点独立性':.25,'逻辑顺序':.15};
  r.score=Math.round(Object.keys(w).reduce((s,k)=>s+r.dims[k].score*w[k],0));
  Object.keys(r.dims).forEach(k=>{if(r.dims[k].pass&&!r.problems.find(p=>p.dim===k))
    r.problems.push({dim:k,pass:true})});
  return r;
}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}

/* 渲染结果 */
function renderResult(text,perfect){
  const a=analyze(text),C=2*Math.PI*50,off=C-(a.score/100)*C;
  const badge=a.score>=90?'金牌':a.score>=75?'银牌':a.score>=60?'铜牌':'';
  const colors={pass:'var(--success)',fail:'var(--danger)'};
  const dimHtml=Object.entries(a.dims).map(([k,d])=>
    `<div class="dimbar"><span class="dl">${k}</span><div class="dc">
      <div class="df" style="width:${d.score}%;background:${d.pass?'var(--success)':'var(--danger)'}"></div></div>
      <span class="ds">${d.score}</span></div>`).join('');
  const fbHtml=a.problems.map(p=>p.pass
    ?`<div class="fb pass"><div class="fi">✓</div><div><div class="ftitle">${p.dim}</div><div class="ftext">表现良好</div></div></div>`
    :`<div class="fb fail"><div class="fi">✗</div><div><div class="ftitle">${p.dim}</div>
       <div class="ftext">${p.text}</div><div class="fsug">${p.sug}</div></div></div>`).join('');
  // 逐句对照
  const fs=firstSentence(text),cFirst=a.dims['结论先行'].pass,tooLong=fs.length>80;
  const cmpHtml=`<div class="cmpitem ${cFirst&&!tooLong?'good':'bad'}">
      <span class="tag">${cFirst&&!tooLong?'结论先行':'结论未前置'}</span>
      <div><strong>你的开头：</strong>${esc(fs.substring(0,70))}${fs.length>70?'…':''}</div>
      <div style="color:var(--muted);margin-top:4px"><strong>完美示范：</strong>${esc(perfect.conclusion)}</div>
      ${tooLong?'<div style="color:var(--danger);margin-top:6px;font-size:12.5px">开头控制在 80 字内，直接抛结论</div>':''}
    </div>`;
  const pyrHtml=`<div class="pyr"><div class="pconc">${esc(perfect.conclusion)}</div>
      <div class="ppoints">${perfect.points.map(p=>`<div class="ppoint"><b>${esc(p.title)}</b><span>${esc(p.evidence)}</span></div>`).join('')}</div></div>`;
  document.getElementById('result').innerHTML=`
    <div class="scorecard">
      <div class="ring"><svg width="130" height="130" viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="50" fill="none" stroke="var(--line)" stroke-width="10"/>
        <circle cx="60" cy="60" r="50" fill="none" stroke="var(--accent)" stroke-width="10"
          stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"/></svg>
        <div class="num"><b>${a.score}</b><small>${badge||'继续加油'}</small></div></div>
      <div class="dimbars">${dimHtml}</div>
    </div>
    <div class="fblist">${fbHtml}</div>
    <div class="compare"><h3>逐句对照</h3>${cmpHtml}</div>
    <div class="perfect"><h3>完美版本 · 金字塔</h3>${pyrHtml}</div>`;
  saveHistory(text,a.score);
}
function saveHistory(text,score){
  const h=store.get('history',[]);
  h.unshift({at:new Date().toLocaleString('zh-CN'),score,entry:state.entry});
  store.set('history',h.slice(0,30));
}

  renderResult(text,perfect);
};
