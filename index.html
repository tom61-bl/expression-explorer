<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>表达力探索 · Expression Explorer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◈</text></svg>">
<style>
:root{
  --paper:#f6f4ef; --ink:#1a1f2e; --soft:#3a4252; --muted:#7a8290;
  --line:#dcd8ce; --card:#fffdf8;
  --navy:#1e3a5f; --terra:#b85c2a; --forest:#3a6b5c; --accent:#1e3a5f;
  --danger:#c0504a; --success:#4a9e6a; --warn:#c99a3f;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,"Courier New",monospace;
  --sans:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
}
body.dark{
  --paper:#14171f; --ink:#e8eaf0; --soft:#c4c9d4; --muted:#8891a0;
  --line:#2a3040; --card:#1c212c;
  --navy:#6f9bd8; --terra:#d98a5c; --forest:#6fa58f;
  --danger:#e07870; --success:#6bc48e; --warn:#dcb46a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;
  line-height:1.7;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.hidden{display:none!important}
.svgic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}

/* 顶栏 */
.topbar{height:58px;display:flex;align-items:center;gap:16px;padding:0 20px;
  border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:20}
.brand{font-weight:700;font-size:16px}
.brand small{font-family:var(--mono);font-size:9.5px;color:var(--muted);font-weight:400;
  letter-spacing:.14em;display:block;text-transform:uppercase}
.modepick{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.modepick button{padding:7px 18px;font-size:13.5px;color:var(--soft);display:flex;gap:7px;align-items:center}
.modepick button.sel{background:var(--accent);color:#fff}
.topbar .spacer{flex:1}
.miniprogress{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.minibar{width:110px;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.minibar i{display:block;height:100%;background:var(--accent);transition:width .4s}
.iconbtn{width:36px;height:36px;border:1px solid var(--line);border-radius:8px;display:inline-flex;
  align-items:center;justify-content:center;color:var(--soft)}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}
.menubtn{display:none}

/* A 学习布局 */
#modeA{display:grid;grid-template-columns:250px 1fr;height:calc(100vh - 58px)}
.sidebar{border-right:1px solid var(--line);overflow-y:auto;padding:14px 12px}
.search{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);
  color:var(--ink);font-family:inherit;font-size:13px;margin-bottom:14px}
.search:focus{outline:none;border-color:var(--accent)}
.group{margin-bottom:15px}
.group>b{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--muted);
  display:flex;justify-content:space-between;padding:0 6px;margin-bottom:6px;text-transform:uppercase}
.lesson{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px;border-radius:8px;font-size:13.5px}
.lesson:hover{background:var(--card)}
.lesson.active{background:var(--card);box-shadow:inset 2px 0 0 var(--accent)}
.ldot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.lesson.active .ldot{background:var(--accent)}
.lesson .lt{flex:1}
.lesson small{font-family:var(--mono);font-size:9px;color:var(--muted);display:block;letter-spacing:.08em}
.anti-entry{width:100%;text-align:left;padding:9px 10px;border-radius:8px;font-size:13px;
  color:var(--terra);border:1px dashed var(--line);margin-top:6px}
.anti-entry:hover{background:var(--card)}
.main{overflow-y:auto;padding:22px 26px;display:flex;flex-direction:column;gap:18px}
.head{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px}
.head h1{font-size:26px}
.head .en{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{padding:7px 16px;font-size:13px;color:var(--soft)}
.seg button.sel{background:var(--accent);color:#fff}
.stage{position:relative;border:1px solid var(--line);border-radius:12px;background:var(--card);
  padding:24px 20px 18px;min-height:228px}
.stage .cap{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.12em;
  text-transform:uppercase;margin-bottom:16px}
.nodes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;position:relative;z-index:2}
.node{border:1px solid var(--line);border-radius:10px;padding:12px 8px;text-align:center;background:var(--paper)}
.node b{display:block;font-size:14px}
.node small{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.06em}
.stage svg.lines{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.traveldot{fill:var(--accent);filter:drop-shadow(0 0 5px var(--accent))}
.flow-base{stroke:var(--line);stroke-width:1.2;fill:none}
.flow-lit{stroke:var(--accent);stroke-width:1.6;fill:none;opacity:0;transition:opacity .35s}
.flow-lit.on{opacity:1}
.ctrl{display:flex;align-items:center;gap:10px}
.ctrl .info{flex:1}
.ctrl .stepname{font-weight:600}
.ctrl .stepdesc{color:var(--muted);font-size:13px}
.pill{font-family:var(--mono);font-size:11px;padding:5px 10px;border:1px solid var(--line);border-radius:7px;color:var(--soft)}
.trace{width:100%;border-collapse:collapse;font-size:13px}
.trace th{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted);text-align:left;
  padding:8px 10px;border-bottom:1px solid var(--line);text-transform:uppercase}
.trace td{padding:9px 10px;border-bottom:1px solid var(--line);color:var(--soft)}
.trace tr.cur td{background:var(--card);color:var(--ink)}
.trace tr.cur td:first-child{box-shadow:inset 2px 0 0 var(--accent)}
.trace .no{font-family:var(--mono);color:var(--muted)}
.casebox{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:22px}
.casebox .ctx{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.1em;
  text-transform:uppercase;margin-bottom:16px}
.casegrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.persona{border-radius:10px;padding:16px;border:1px solid var(--line)}
.persona.junior{border-left:4px solid var(--danger)}
.persona.senior{border-left:4px solid var(--success)}
.persona .who{font-weight:700;font-size:14px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.persona .who small{font-family:var(--mono);font-size:10px;color:var(--muted);font-weight:400}
.persona .say{font-size:14px;line-height:1.75;margin-bottom:10px}
.persona .pnote{font-size:12.5px;color:var(--muted)}
.casediff{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);font-size:13.5px;color:var(--soft)}
.casediff b{color:var(--accent)}
.pitfall{margin-top:14px;padding:14px 16px;border-radius:10px;
  background:color-mix(in srgb,var(--terra) 10%,transparent);border-left:4px solid var(--terra)}
.pitfall b{font-size:13px;display:block;margin-bottom:4px}
.pitfall span{font-size:13.5px;color:var(--soft)}

/* 微练习 */
.drillcard{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:22px}
.drillcard .tag{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.1em;
  text-transform:uppercase;margin-bottom:10px}
.drillcard .q{font-size:14.5px;font-weight:600;margin-bottom:6px}
.drillcard .hint{font-size:13px;color:var(--muted);margin-bottom:14px}
.drillrow{display:flex;gap:10px;flex-wrap:wrap}
.drillrow input{flex:1;min-width:220px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;
  background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px}
.drillrow input:focus{outline:none;border-color:var(--accent)}
.drillfb{margin-top:12px;font-size:13.5px;border-radius:10px;padding:12px 14px;display:none}
.drillfb.show{display:block}
.drillfb.ok{background:color-mix(in srgb,var(--success) 12%,transparent);color:var(--soft)}
.drillfb.no{background:color-mix(in srgb,var(--danger) 10%,transparent);color:var(--soft)}
.drillfb b{display:block;margin-bottom:3px}
.gotrain{margin-top:4px}
.gotrain button{display:inline-flex;gap:8px;align-items:center;color:var(--accent);font-size:13.5px;font-weight:600}

/* 反模式视图 */
.antiwrap{display:flex;flex-direction:column;gap:12px}
.anti-item{border:1px solid var(--line);border-left:4px solid var(--danger);border-radius:10px;
  padding:16px 18px;background:var(--card)}
.anti-item b{font-size:14.5px;display:block;margin-bottom:4px}
.anti-item .bad{font-size:13.5px;color:var(--soft);margin-bottom:8px}
.anti-item .fix{font-size:13.5px;color:var(--forest)}
.anti-item .fix::before{content:"替代做法 · ";font-weight:700}

/* B 训练布局 */
#modeB{height:calc(100vh - 58px);overflow-y:auto}
.bwrap{max-width:920px;margin:0 auto;padding:28px 26px 60px}
.bh{margin-bottom:20px}
.bh h2{font-size:24px}
.bh p{color:var(--muted);font-size:14px;margin-top:4px}
.entrypick{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.entrypick button{padding:8px 18px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;color:var(--soft)}
.entrypick button.sel{border-color:var(--accent);color:var(--accent)}
.catpick{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap}
.catpick button{padding:6px 13px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;color:var(--soft)}
.catpick button.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.qpick{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);
  color:var(--ink);font-family:inherit;font-size:14px;margin-bottom:14px}
.rawbox{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:10px;
  padding:16px 18px;font-size:13.5px;color:var(--soft);margin-bottom:14px;white-space:pre-wrap}
.rawbox .rt{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.1em;
  text-transform:uppercase;display:block;margin-bottom:8px}
textarea{width:100%;min-height:210px;background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:16px;font-family:var(--sans);font-size:15px;line-height:1.8;color:var(--ink);resize:vertical}
textarea:focus{outline:none;border-color:var(--accent)}
.btnrow{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap}
.btnprimary{background:var(--accent);color:#fff;padding:12px 30px;border-radius:10px;font-size:15px;font-weight:600}
.btnprimary:hover{opacity:.9}
.btnghost{padding:12px 24px;border:1px solid var(--line);border-radius:10px;font-size:15px;color:var(--soft)}

/* 听众视角 */
.audscene{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);
  color:var(--ink);font-family:inherit;font-size:14px;margin-bottom:14px}
.audtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.audtab{padding:8px 16px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;color:var(--soft)}
.audtab.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.audversion{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:22px;
  font-size:15px;line-height:1.85;margin-bottom:14px}
.audversion .who{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.12em;
  text-transform:uppercase;display:block;margin-bottom:10px}
.auddiff{font-size:13.5px;color:var(--soft);border-top:1px dashed var(--line);padding-top:14px}
.auddiff b{color:var(--accent)}

/* 检查结果 */
.result{margin-top:26px;display:flex;flex-direction:column;gap:20px}
.checksummary{font-family:var(--mono);font-size:12.5px;color:var(--muted);
  border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--card)}
.checksummary b{color:var(--ink)}
.checkgroup b{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--muted);
  text-transform:uppercase;display:block;margin-bottom:10px}
.checklist{display:flex;flex-direction:column;gap:10px}
.chk{border-radius:10px;padding:14px 16px;display:flex;gap:13px;align-items:flex-start;
  border:1px solid var(--line)}
.chk.pass{background:color-mix(in srgb,var(--success) 10%,transparent);border-left:4px solid var(--success)}
.chk.fail{background:color-mix(in srgb,var(--danger) 9%,transparent);border-left:4px solid var(--danger)}
.chk .ci{width:25px;height:25px;border-radius:50%;flex:none;display:flex;align-items:center;
  justify-content:center;color:#fff;font-size:12.5px;font-weight:700}
.chk.pass .ci{background:var(--success)} .chk.fail .ci{background:var(--danger)}
.chk .ctitle{font-weight:600;font-size:14px}
.chk .ctext{font-size:13px;color:var(--muted);margin-top:2px}
.chk .csug{font-size:13px;color:var(--accent);margin-top:7px;padding-top:7px;border-top:1px dashed var(--line)}
.compare{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.compare h3,.perfect h3{font-size:16px;margin-bottom:14px}
.cmpitem{border-radius:10px;padding:14px 16px;margin-bottom:10px;font-size:13.5px}
.cmpitem.good{border-left:4px solid var(--success);background:color-mix(in srgb,var(--success) 9%,transparent)}
.cmpitem.bad{border-left:4px solid var(--danger);background:color-mix(in srgb,var(--danger) 9%,transparent)}
.cmpitem .tag{display:inline-block;padding:2px 8px;border-radius:5px;color:#fff;font-size:11px;margin-bottom:6px}
.cmpitem.good .tag{background:var(--success)} .cmpitem.bad .tag{background:var(--danger)}
.perfect{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.pyr{display:flex;flex-direction:column;align-items:center;gap:14px}
.pyr .pconc{background:var(--accent);color:#fff;border-radius:12px;padding:16px 24px;width:100%;text-align:center}
.pyr .ppoints{width:100%;display:flex;flex-direction:column;gap:10px}
.ppoint{border:1px solid var(--accent);border-radius:10px;padding:12px 16px}
.ppoint b{font-size:14px} .ppoint span{display:block;font-size:13px;color:var(--muted);margin-top:3px}

/* 侧栏专题入口 */
.side-entry{width:100%;text-align:left;padding:9px 10px;border-radius:8px;font-size:13px;
  color:var(--soft);border:1px solid var(--line);margin-top:8px}
.side-entry:hover{background:var(--card);border-color:var(--accent)}

/* 一页速查 */
.cheattable{width:100%;border-collapse:collapse;font-size:13px}
.cheattable th{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted);text-align:left;
  padding:8px 10px;border-bottom:1px solid var(--line);text-transform:uppercase}
.cheattable td{padding:9px 10px;border-bottom:1px solid var(--line);color:var(--soft);vertical-align:top}
.cheattable td:first-child{color:var(--ink);white-space:nowrap}

/* 框架库 */
.fw-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.fw-tab{padding:8px 15px;border:1px solid var(--line);border-radius:8px;font-size:13px;color:var(--soft)}
.fw-tab.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.fw-card{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:22px;
  display:flex;flex-direction:column;gap:14px}
.fw-card h3{font-size:16px}
.fw-card p{font-size:14px;color:var(--soft)}
.fw-card .src{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.08em}
.fw-card table{width:100%;border-collapse:collapse;font-size:13px}
.fw-card th{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--muted);text-align:left;
  padding:7px 9px;border-bottom:1px solid var(--line)}
.fw-card td{padding:8px 9px;border-bottom:1px solid var(--line);color:var(--soft);vertical-align:top}
.fw-card td:first-child{color:var(--ink);white-space:nowrap}
.fw-quote{border-left:3px solid var(--line);padding:4px 0 4px 14px;font-size:13.5px;color:var(--muted)}
.fw-note{font-size:13.5px;padding:13px 15px;border-radius:10px;
  background:color-mix(in srgb,var(--accent) 8%,transparent);color:var(--soft)}

/* 开口前自检 */
.pf-list{display:flex;flex-direction:column;gap:10px}
.pf-item{display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border:1px solid var(--line);
  border-radius:10px;background:var(--paper);font-size:14px}
.pf-item input{margin-top:5px;width:16px;height:16px;accent-color:var(--accent);flex:none}
.pf-item.done{border-color:var(--success)}
.pf-done{display:none;font-size:14px;padding:14px 16px;border-radius:10px;
  background:color-mix(in srgb,var(--success) 12%,transparent);color:var(--soft)}
.pf-done.show{display:block}

/* 维度经典来源 */
.dim-source{font-family:var(--mono);font-size:10px;color:var(--muted);font-weight:400;margin-left:7px}

/* 移动端抽屉与遮罩 */
.scrim{display:none;position:fixed;top:58px;left:0;right:0;bottom:0;background:rgba(20,23,31,.45);z-index:30}
.scrim.show{display:block}
@media(max-width:780px){
  .menubtn{display:inline-flex}
  #modeA{grid-template-columns:1fr}
  .sidebar{position:fixed;top:58px;left:0;bottom:0;width:260px;z-index:40;
    transform:translateX(-100%);transition:transform .25s ease;background:var(--paper)}
  .sidebar.open{transform:none}
  .main{padding:18px 16px}
  .nodes{grid-template-columns:repeat(2,1fr)}
  .casegrid{grid-template-columns:1fr}
  .modepick button{padding:7px 12px}
  .minibar{display:none}
}
</style>
</head>
<body>
<header class="topbar">
  <button class="iconbtn menubtn" id="menubtn">
    <svg class="svgic" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <div class="brand">表达力探索<small>Expression Explorer</small></div>
  <div class="modepick">
    <button id="m-A" class="sel">学习</button>
    <button id="m-B">训练</button>
  </div>
  <div class="spacer"></div>
  <div class="miniprogress">
    <span id="mp-text">0 / 10</span>
    <div class="minibar"><i id="mp-fill"></i></div>
  </div>
  <button class="iconbtn" id="themebtn">
    <svg class="svgic" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
  </button>
</header>
<div class="scrim" id="scrim"></div>

<!-- ===== 模式 A：学习 ===== -->
<section id="modeA">
  <aside class="sidebar" id="sidebar">
    <input class="search" id="navsearch" placeholder="搜索课程 / 关键词…">
    <div id="nav"></div>
    <button class="side-entry" id="cheat-entry">一页速查 →</button>
    <button class="side-entry" id="fw-entry">经典框架库 →</button>
    <button class="anti-entry" id="anti-entry">反模式速查 →</button>
  </aside>
  <div class="main">
    <div id="lesson-view">
      <div class="head">
        <div>
          <h1 id="title"></h1>
          <div class="en" id="en"></div>
        </div>
        <div class="seg">
          <button id="sc-plain">普通说法</button>
          <button id="sc-better">更好说法</button>
        </div>
      </div>
      <div class="stage">
        <div class="cap" id="scenecap"></div>
        <svg class="lines" id="lines" preserveAspectRatio="none" viewBox="0 0 100 100"></svg>
        <div class="nodes" id="nodes"></div>
      </div>
      <div class="ctrl">
        <button class="iconbtn" id="playbtn">
          <svg class="svgic" viewBox="0 0 24 24" id="playic"><path d="M7 5v14l11-7z"/></svg>
        </button>
        <button class="iconbtn" id="resetbtn">
          <svg class="svgic" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/></svg>
        </button>
        <span class="pill" id="speedtxt">1×</span>
        <div class="info">

/* ================= 状态与本地存储 ================= */
const store={
  get(k,d){try{return JSON.parse(localStorage.getItem('expr_'+k))??d}catch(e){return d}},
  set(k,v){try{localStorage.setItem('expr_'+k,JSON.stringify(v))}catch(e){}}
};
let state={mode:store.get('mode','A'),lesson:store.get('lesson','conclusion-first'),
  scene:store.get('scene','plain'),step:0,playing:false,timer:null,speed:1,
  entry:store.get('entry','bank'),bankcat:store.get('bankcat','业务汇报'),
  audscene:store.get('audscene','project-delay'),aud:store.get('aud','boss'),
  view:'lesson'};

/* ================= 工具函数 ================= */
function curLesson(){return LESSONS.find(l=>l.id===state.lesson)||LESSONS[0]}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function firstSentence(t){const s=t.split(/[。！？\n]/).filter(x=>x.trim())[0]||'';return s.trim()}
function extractPoints(t){
  const parts=t.split(/(?:第一|第二|第三|首先|其次|然后|最后|\d[.、])/).map(s=>s.trim()).filter(s=>s.length>8);
  return parts.length>=2?parts:t.split(/[。！？]/).filter(s=>s.trim().length>10);
}
function keywords(s){
  const words=s.match(/[一-龥]{2,4}/g)||[];
  return [...new Set(words)].filter(w=>!['我们','一个','可以','因为','所以','领导','目前'].includes(w));
}

/* ================= 侧栏导航 ================= */
function renderNav(){
  const q=(document.getElementById('navsearch').value||'').toLowerCase();
  document.getElementById('nav').innerHTML=GROUPS.map(g=>{
    const ls=LESSONS.filter(l=>l.group===g.id&&(!q||l.title.toLowerCase().includes(q)||l.en.toLowerCase().includes(q)));
    if(!ls.length)return '';
    return `<div class="group"><b><span>${g.name}</span><span>${ls.length}</span></b>`+
      ls.map(l=>`<button class="lesson ${l.id===state.lesson?'active':''}" data-id="${l.id}">
        <span class="ldot" style="background:${g.color}"></span>
        <span class="lt">${l.title}<small>${l.en}</small></span></button>`).join('')+'</div>';
  }).join('');
  document.querySelectorAll('.lesson').forEach(b=>b.onclick=()=>{
    state.lesson=b.dataset.id;state.view='lesson';
    store.set('lesson',state.lesson);state.step=0;stopPlay();
    showLessonView();renderA();closeDrawer()});
}

function renderDrill(){
  const d=curLesson().drill;
  document.getElementById('drillcard').innerHTML=`
    <div class="tag">30 秒微练习 · Drill</div>
    <div class="q">${esc(d.q)}</div>
    <div class="hint">${esc(d.hint)}</div>
    <div class="drillrow">
      <input id="drillinput" placeholder="只写这一个动作…">
      <button class="btnprimary" id="drillbtn" style="padding:11px 22px">检查</button>
    </div>
    <div class="drillfb" id="drillfb"></div>`;
  document.getElementById('drillbtn').onclick=checkDrill;
  document.getElementById('drillinput').addEventListener('keydown',e=>{if(e.key==='Enter')checkDrill()});
}
function checkDrill(){
  const d=curLesson().drill,val=document.getElementById('drillinput').value.trim(),
    fb=document.getElementById('drillfb');
  const hit=d.words.some(w=>val.includes(w));
  const lenOk=val.length<=d.maxlen;
  fb.className='drillfb show '+(hit&&lenOk?'ok':'no');
  if(hit&&lenOk){
    fb.innerHTML=`<b>这个动作你过了。</b>范例：${esc(d.example)}`;
    markDone();
  }else if(!lenOk){
    fb.innerHTML=`<b>再试一次。</b>超过 ${d.maxlen} 字了，微练习只练一个动作，不要展开。`;
  }else{
    fb.innerHTML=`<b>再试一次。</b>回看提示，换一个更直接的词开头。`;
  }
}

/* ================= 画布连接线与圆点 ================= */
function drawStage(){
  const n=curLesson()[state.scene].steps.length;
  const xs=Array.from({length:n},(_,i)=>12.5+i*(75/(n-1)));
  let paths='';
  for(let i=0;i<n-1;i++){
    paths+=`<path class="flow-base" d="M${xs[i]},30 H${xs[i+1]}"/>`;
    paths+=`<path class="flow-lit ${i<state.step?'on':''}" d="M${xs[i]},30 H${xs[i+1]}"/>`;
  }
  paths+=`<circle class="traveldot" r="2.6" cx="${xs[state.step]}" cy="30"/>`;
  document.getElementById('lines').innerHTML=paths;
}
function updateStep(){
  const sc=curLesson()[state.scene],s=sc.steps[state.step];
  document.getElementById('stepname').textContent=`0${state.step+1} · ${s.name}`;
  document.getElementById('stepdesc').textContent=s.obs;
  document.querySelectorAll('#tracebody tr').forEach((r,i)=>r.classList.toggle('cur',i===state.step));
  drawStage();
}
function playStep(){
  const n=curLesson()[state.scene].steps.length;
  if(state.step>=n-1){stopPlay();return}
  state.step++;updateStep();
}
function startPlay(){
  const n=curLesson()[state.scene].steps.length;
  if(state.step>=n-1)state.step=0;
  state.playing=true;
  document.getElementById('playic').innerHTML='<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
  state.timer=setInterval(playStep,1400/state.speed);
}
function stopPlay(){state.playing=false;clearInterval(state.timer);
  document.getElementById('playic').innerHTML='<path d="M7 5v14l11-7z"/>';}

/* ================= 进度（微练习通过才标记） ================= */
function updateMini(){
  const done=store.get('done',[]);
  document.getElementById('mp-text').textContent=done.length+' / 10';
  document.getElementById('mp-fill').style.width=(done.length*10)+'%';
}
function markDone(){
  const d=new Set(store.get('done',[]));d.add(state.lesson);
  store.set('done',[...d]);updateMini();
}

function renderBlock(b){
  switch(b.t){
    case 'p': return `<p>${esc(b.text)}</p>`;
    case 'note': return `<div class="fw-note">${esc(b.text)}</div>`;
    case 'quote': return `<div class="fw-quote">${esc(b.text)}</div>`;
    case 'preflight':
      return `<div class="pf-list" id="pf-list">`+PREFLIGHT_QUESTIONS.map((q,i)=>
        `<label class="pf-item"><input type="checkbox" data-i="${i}"><span>${esc(q)}</span></label>`).join('')+
        `</div><div class="pf-done" id="pf-done">五问全部通过，可以开口了。</div>`;
    case 'table':
      return `<table><thead><tr>`+b.head.map(h=>`<th>${esc(h)}</th>`).join('')+`</tr></thead><tbody>`+
        b.rows.map(r=>`<tr>`+r.map(c=>`<td>${esc(c)}</td>`).join('')+`</tr>`).join('')+
        `</tbody></table>`;
  }
  return '';
}

  document.querySelectorAll('.audtab').forEach(b=>b.onclick=()=>{
    state.aud=b.dataset.aud;store.set('aud',state.aud);renderAudience()});
  document.getElementById('audscene').onchange=e=>{
    state.audscene=e.target.value;store.set('audscene',state.audscene);renderAudience()};
  const sc=AUDIENCE_SCENES.find(s=>s.id===state.audscene);
  document.getElementById('audversion').innerHTML=`
    <span class="who">对 ${AUDIENCE_LABELS[state.aud]}说</span>${esc(sc.versions[state.aud])}`;
  document.getElementById('auddiff').innerHTML=`<b>差异说明：</b>${esc(sc.diff)}`;
}

/* ================= 8 维结构检查 ================= */
const CHECK_GROUPS=[
 {id:'frame',name:'骨架 · 框架性检查',items:['conclusion','mece','order','action']},
 {id:'flesh',name:'血肉 · 信息与立场检查',items:['evidence','specific','conciseness','audience']}
];
function runChecks(text){
  const r={};
  /* 1 结论先行 */
  const fs=firstSentence(text);
  const cWords=['因此','建议','结论','需要','必须','提议','核心','总结','我认为','申请','会延期','不能'];
  const bWords=['因为','虽然','首先','之前','背景','根据','领导好','是这样','情况是'];
  const cLead=cWords.some(w=>fs.includes(w))&&!bWords.some(w=>fs.includes(w));
  const tooLong=fs.length>80;
  r.conclusion={pass:cLead&&!tooLong,
    reason:!cLead?'开头更像背景铺垫，第一句没有直接给判断。':'第一句直接给了判断，对方不用猜。',
    sug:'用「因此」「建议」「结论是」开头，直接抛出结论，第一句控制在 80 字内。'};
  if(tooLong)r.conclusion={pass:false,
    reason:'第一句超过 80 字，结论被长句淹没。',
    sug:'把背景移到后面，第一句只留判断。'};
  /* 2 MECE 论点独立 */
  const pts=extractPoints(text),kws=pts.map(keywords);
  let overlap=0,pairs=0;
  for(let i=0;i<kws.length;i++)for(let j=i+1;j<kws.length;j++){pairs++;
    const inter=kws[i].filter(k=>kws[j].includes(k));
    const uni=new Set([...kws[i],...kws[j]]);
    if(inter.size/uni.size>0.3)overlap++;}
  const mPass=pts.length>=2&&overlap/Math.max(pairs,1)<0.5;
  r.mece={pass:mPass,
    reason:mPass?'各论点讲不同方面，没有明显交叉。':'论点之间存在内容交叉或重复。',
    sug:'确认每点只讲一个方面，合并重复内容，按 MECE 重新归类。'};
  /* 3 顺序组织 */
  const hasOrder=/第一.*第二|1.*2.*3|一.*二|首先.*然后|首先|其次|最后/.test(text);
  r.order={pass:hasOrder,
    reason:hasOrder?'有编号或顺序词，对方能跟着走。':'论点排列缺少明显顺序。',
    sug:'用编号（第一、第二）或顺序词（首先、然后、最后）组织。'};
  /* 4 行动指向 */
  const aWords=['建议','请','下一步','需要','麻烦','确认','请于','申请','决定','拍板','要求','启动'];
  const hasAction=aWords.some(w=>text.includes(w));
  r.action={pass:hasAction,
    reason:hasAction?'文中有明确的动作或请求。':'听完不知道要做什么、谁来做。',
    sug:'结尾补一句明确的下一步，写清谁在什么时间做什么。'};
  /* 5 论据支撑 */
  const ev=[/[0-9]+%/,/[0-9]+(?:人|次|台|个|起|例|万|元|块|天)/,/数据|根据|相比|增长|下降/,/共计|平均|累计|完成|占比/];
  const ec=ev.filter(p=>p.test(text)).length;
  r.evidence={pass:ec>=2,
    reason:ec>=2?'有数字、对比或事实支撑。':'缺少具体数据或事实，论点站不住。',
    sug:'加百分比、金额、人数，或一个对比、一个案例。'};
  /* 6 具体程度 */
  const vague=['效果不好','体验不佳','高度重视','积极','相关','一定','大概','可能','也许','尽快','加强','提升','优化','落实'];
  const vagueCount=vague.filter(w=>text.includes(w)).length;
  const hasNum=/[0-9]/.test(text);
  r.specific={pass:hasNum&&vagueCount<=3,
    reason:hasNum&&vagueCount<=3?'有可感知的细节，没有停在抽象层。':'抽象词偏多，缺少可验证的细节。',
    sug:'下抽象梯子：把"很快"换成"3 天内"，把"很多"换成具体数字。'};
  /* 7 简洁度 */
  const hedge=['可能','也许','大概','尽量','我觉得','那个','应该','差不多','看看','估计','恐怕','说不准'];
  const hedgeCount=hedge.filter(w=>text.includes(w)).length;
  r.conciseness={pass:hedgeCount<2,
    reason:hedgeCount<2?'没有口头禅和犹豫词，信息干净。':'犹豫词或口头禅偏多，削弱确定感。',
    sug:'删掉「可能、也许、我觉得、那个」，动词优先，一句话只讲一件事。'};
  /* 8 听众立场 */
  const youCount=(text.match(/你|您/g)||[]).length;
  r.audience={pass:youCount>=1,
    reason:youCount>=1?'出现了对方视角，不只是自说自话。':'全程"我/我们"，没有告诉对方这跟他有什么关系。',
    sug:'补一句对听众的价值："对你来说……"，或用"你能、帮你"把对方拉进来。'};
  return r;
}

/* ================= 检查结果渲染 ================= */
const DIM_NAMES={conclusion:'结论先行',mece:'论点独立（MECE）',order:'顺序组织',action:'行动指向',
  evidence:'论据支撑',specific:'具体程度',conciseness:'简洁度',audience:'听众立场'};
const DIM_SOURCE={conclusion:'金字塔原理',mece:'金字塔原理',order:'SCQA / 金字塔',
  action:'PREP / 行动号召',evidence:'Logos / 数据论证',specific:'SUCCESs',
  conciseness:'信息增量',audience:'Ethos / 听众视角'};
function renderResult(text,perfect){
  const r=runChecks(text);
  const passCount=Object.values(r).filter(x=>x.pass).length;
  const cFirst=r.conclusion.pass;
  const fs=firstSentence(text);
  const checksHtml=CHECK_GROUPS.map(g=>
    `<div class="checkgroup"><b>${g.name}</b><div class="checklist">`+
    g.items.map(k=>{const x=r[k];
      return `<div class="chk ${x.pass?'pass':'fail'}">
        <div class="ci">${x.pass?'✓':'!'}</div>
        <div><div class="ctitle">${DIM_NAMES[k]}<span class="dim-source">出自 · ${DIM_SOURCE[k]}</span></div>
        <div class="ctext">${esc(x.reason)}</div>
        ${x.pass?'':`<div class="csug">${esc(x.sug)}</div>`}</div></div>`;}).join('')+
    `</div></div>`).join('');
  const cmpHtml=`<div class="cmpitem ${cFirst?'good':'bad'}">
      <span class="tag">${cFirst?'结论先行':'结论未前置'}</span>
      <div><strong>你的开头：</strong>${esc(fs.substring(0,70))}${fs.length>70?'…':''}</div>
      <div style="color:var(--muted);margin-top:4px"><strong>参考示范：</strong>${esc(perfect.conclusion)}</div>
    </div>`;
  const pyrHtml=`<div class="pyr"><div class="pconc">${esc(perfect.conclusion)}</div>
      <div class="ppoints">${perfect.points.map(p=>`<div class="ppoint"><b>${esc(p.title)}</b><span>${esc(p.evidence)}</span></div>`).join('')}</div></div>`;
  document.getElementById('result').innerHTML=`
    <div class="checksummary">结构自查，不是写作评价。它只检查骨架，不判断你说得好不好。<br>
      <b>8 项检查 · 通过 ${passCount} 项</b>（待改进项附可执行建议）</div>
    ${checksHtml}
    <div class="compare"><h3>逐句对照</h3>${cmpHtml}</div>
    <div class="perfect"><h3>参考版本 · 金字塔</h3>${pyrHtml}</div>`;
  saveHistory(passCount);
}
function saveHistory(passCount){
  const h=store.get('history',[]);
  h.unshift({at:new Date().toLocaleString('zh-CN'),passCount,entry:state.entry});
  store.set('history',h.slice(0,30));
}
document.getElementById('analyzebtn').onclick=()=>{
  const text=document.getElementById('usertext').value.trim();
  if(text.length<15){document.getElementById('usertext').focus();return}
  const perfect=state.entry==='bank'
    ?(BANK.find(x=>x.id===document.getElementById('qselect').value)||BANK[0]).perfect
    :{conclusion:'（自由表达无固定答案，参考各维度建议改写）',
      points:[{title:'先给结论',evidence:'第一句直接抛判断'},{title:'再给支撑',evidence:'论点独立、配数据'}]};
  renderResult(text,perfect);
};
document.getElementById('clearbtn').onclick=()=>{
  document.getElementById('usertext').value='';
  document.getElementById('result').innerHTML='';
  document.getElementById('usertext').focus()};

/* ================= 初始化 ================= */
renderNav();renderA();
if(state.mode==='B')switchMode('B');
</script>
